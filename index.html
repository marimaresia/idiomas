.tabs .on{background:var(--but);border-color:var(--ink)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding:8px 0}
.item:first-child{border-top:0}

.chip.on{background:var(--but)}
.tag{font-size:.85rem;border:1px solid var(--ink);border-radius:8px;padding:0 6px;margin-right:4px;background:var(--but)}
.ck{display:inline-flex;gap:4px;align-items:center;margin-right:10px;font-size:1rem}
ol{margin:6px 0;padding-left:22px}
a{color:var(--ink)}

#v-today{display:grid;grid-template-columns:1fr;gap:0 12px}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:0 12px}
.blk{display:block;text-align:left;width:100%;font:inherit;color:var(--ink);cursor:pointer}
.blk span{display:block}.blk .bar{display:block}
.big2{font-family:Caveat,cursive;font-size:1.7rem;line-height:1.1}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border:2px solid var(--ink);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){#sheet{align-items:center}#sheet .in{border-radius:18px}}
input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px 8px}
</style>
</head>

function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return fd(new Date())}
function add(iso,n){var d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return fd(d)}
function tg(s){var o=[];String(s||"").split(/[,|]/).forEach(function(x){x=x.trim().toLowerCase();if(x&&o.indexOf(x)<0)o.push(x)});return o}
function seedSrc(l){return(SEEDS[l]||[]).map(function(x,i){return{id:"s"+l+i,lang:l,name:x[0],url:x[1],skills:x[2],note:x[3],status:"to try"}})}
function norm(){
  if(!S.plans)S.plans={};if(!S.blog)S.blog={};if(!S.src)S.src=[];if(!S.seeded)S.seeded={};
  Object.keys(S.langs).forEach(function(l){if(S.seeded[l])return;S.seeded[l]=1;if(!S.src.some(function(s){return s.lang===l}))S.src=S.src.concat(seedSrc(l))});
}

  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}

}

function byId(id){return S.cards.find(function(c){return c.id===id})}

  sh.innerHTML='<div class="in" role="dialog" aria-modal="true" aria-label="'+esc(b.name)+'">'+h+'</div>';sh.hidden=false;tick();
}
function rWeek(){
  var P=plan(),dow=(new Date().getDay()+6)%7,mon=add(today(),-dow);
  var h='<h2>Weekly plan · '+LN[S.cur]+'</h2><p class="mute">Set the minutes of each block, rename it or add new ones. Open a block on Today to study it.</p><div class="days">';
  ORDW.forEach(function(w){var bs=P[w],tot=bs.reduce(function(a,b){return a+b.min},0);
    h+='<div class="box"><b>'+DN[w]+'</b> <span class="mute">'+tot+' min</span>'+bs.map(function(b,i){var key=w+"|"+i;
      return'<div class="item"><input type="text" value="'+esc(b.name)+'" data-pn="'+key+'" aria-label="Block name" style="flex:1;min-width:0"><span><input type="number" min="0" max="240" value="'+b.min+'" data-pm="'+key+'" style="width:70px" aria-label="Minutes"> <button class="ghost" data-pd="'+key+'">'+(DEL===key?'Confirm':'×')+'</button></span></div>'}).join("")+
      '<form data-f="addblk" data-w="'+w+'" class="row" style="flex-wrap:nowrap"><input type="text" name="nm" placeholder="New block" required aria-label="Block name"><input type="number" name="mn" min="1" max="240" value="15" style="width:70px" aria-label="Minutes"><select name="sk" aria-label="Skill"><option value="">No skill</option>'+SK.map(function(x){return'<option>'+x+'</option>'}).join("")+'</select><button class="ghost" type="submit">+</button></form></div>'});
  h+='</div><div class="box"><b>Logged this week</b>';
  for(var i=0;i<7;i++){var d=add(mon,i),mm=mins(d);h+='<div class="item"><span><b>'+DN[(i+1)%7]+'</b>'+(d===today()?' ← today':'')+'</span><span>'+mm+' min'+(mm>=GOAL?' ✓':'')+'</span></div>'}
  $("v-week").innerHTML=h+'</div>';
}
var ORDW=[1,2,3,4,5,6,0];
function tags(){var o={};mine().forEach(function(c){(c.g||[]).forEach(function(t){o[t]=1})});return Object.keys(o).sort()}
function rCards(){
  var tl=tags();if(CT&&tl.indexOf(CT)<0)CT="";
  var h='<div class="box"><form id="cf" autocomplete="off"><input type="text" id="cw" placeholder="Word" required aria-label="Word"><input type="text" id="cs" placeholder="Example sentence" aria-label="Sentence"><input type="text" id="ct" placeholder="Translation" required aria-label="Translation"><input type="text" id="cr" placeholder="Source (optional)" aria-label="Source"><input type="text" id="cg" placeholder="Tags, comma separated (optional)" aria-label="Tags"><button class="btn" type="submit">Add card</button></form></div>';
  h+='<div class="box"><input type="text" id="cq" placeholder="Search cards" value="'+esc(CQ)+'" aria-label="Search cards"><select id="cstat" aria-label="Filter by status">'+[["all","All cards"],["new","New"],["due","Due"]].map(function(o){return'<option value="'+o[0]+'"'+(o[0]===CS?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select>';
  if(tl.length)h+='<div class="chips">'+[""].concat(tl).map(function(t){return'<button type="button" class="chip'+(t===CT?' on':'')+'" data-ct="'+esc(t)+'">'+(t?esc(t):'All tags')+'</button>'}).join("")+'</div>';
  h+='</div><div class="box" id="cl"></div>';
  h+='<div class="box"><b>Backup</b><p class="mute">Your data lives only in this browser. Export now and then and keep the text somewhere safe. Format: word;sentence;translation;source;tag|tag</p><textarea id="io" rows="4" aria-label="CSV"></textarea><div class="row"><button class="ghost" id="ex" type="button">Export</button><button class="ghost" id="im" type="button">Import</button></div></div>';
  $("v-cards").innerHTML=h;rCardList();
}
function editForm(c){
  return'<form data-f="cedit" data-id="'+c.id+'" style="width:100%"><input type="text" name="w" value="'+esc(c.w)+'" required aria-label="Word"><input type="text" name="s" value="'+esc(c.s||"")+'" placeholder="Example sentence" aria-label="Sentence"><input type="text" name="t" value="'+esc(c.t)+'" required aria-label="Translation"><input type="text" name="r" value="'+esc(c.r||"")+'" placeholder="Source" aria-label="Source"><input type="text" name="g" value="'+esc((c.g||[]).join(", "))+'" placeholder="Tags, comma separated" aria-label="Tags"><div class="row"><button class="btn" type="submit">Save</button><button class="ghost" type="button" data-ce="1">Cancel</button></div></form>';
}
function rCardList(){
  var el=$("cl");if(!el)return;
  var t=today(),q=CQ.toLowerCase(),all=mine().slice().reverse(),m=all.filter(function(c){
    if(CT&&(c.g||[]).indexOf(CT)<0)return false;
    if(CS==="new"&&c.seen)return false;
    if(CS==="due"&&!(c.seen&&c.due<=t))return false;
    return !q||[c.w,c.s,c.t,c.r].concat(c.g||[]).join(" ").toLowerCase().indexOf(q)>-1});
  var h='<b>'+(m.length===all.length?m.length:m.length+' of '+all.length)+' cards in '+LN[S.cur]+'</b>';
  m.slice(0,CL).forEach(function(c){
    if(ED===c.id){h+='<div class="item">'+editForm(c)+'</div>';return}
    h+='<div class="item"><span><b>'+esc(c.w)+'</b> · '+esc(c.t)+(c.s?'<br><span class="mute">'+esc(c.s)+'</span>':'')+'<br>'+(c.g||[]).map(function(x){return'<span class="tag">'+esc(x)+'</span>'}).join("")+'<span class="mute">'+(c.seen?(c.due<=t?'due today':'due '+c.due):'new')+'</span></span><span><button class="ghost" data-ed="'+c.id+'">Edit</button> <button class="ghost" data-del="'+c.id+'">'+(DEL===c.id?'Confirm':'Remove')+'</button></span></div>'});
  if(!m.length)h+='<p class="mute">No cards match.</p>';
  if(m.length>CL)h+='<div class="row"><button class="ghost" data-more="1">Show more ('+(m.length-CL)+' left)</button></div>';
  el.innerHTML=h;
}
function rSrc(){
  var m=S.src.filter(function(s){return s.lang===S.cur&&(SF==="all"||s.skills.indexOf(SF)>-1)});
  var h='<h2>Sources · '+LN[S.cur]+'</h2><div class="chips">'+["all"].concat(SK).map(function(k){return'<button class="chip'+(k===SF?' on':'')+'" data-sf="'+k+'">'+cap(k)+'</button>'}).join("")+'</div><div class="box">';
  h+=m.length?m.map(function(s){return'<div class="item"><span>'+link(s)+'<br><span class="mute">'+s.skills.map(cap).join(" · ")+' — '+esc(s.note)+'</span></span><span><select data-ss="'+s.id+'" aria-label="Status">'+["to try","using","done"].map(function(o){return'<option'+(o===s.status?' selected':'')+'>'+o+'</option>'}).join("")+'</select> <button class="ghost" data-sdel="'+s.id+'">'+(DEL===s.id?'Confirm':'Remove')+'</button></span></div>'}).join(""):'<p class="mute">Nothing here yet.</p>';
  h+='</div><div class="box"><b>Add a source</b><form id="sf" autocomplete="off"><input type="text" id="sn" placeholder="Name" required aria-label="Name"><input type="url" id="su" placeholder="https://…" aria-label="Link"><input type="text" id="so" placeholder="Note (optional)" aria-label="Note"><p>'+SK.map(function(k){return'<label class="ck"><input type="checkbox" name="sk" value="'+k+'"> '+cap(k)+'</label>'}).join("")+'</p><button class="btn" type="submit">Save source</button></form></div>';
  $("v-src").innerHTML=h;
}
function rRev(){
  var el=$("v-rev"),k=counts(),u=(R.h&&R.h.length)?'<button class="ghost" data-undo="1">↶ Undo last grade</button>':'';
  if(!R.on){el.innerHTML='<div class="box y"><h2>Review</h2><p>'+k.d+' to review · '+k.n+' new</p>'+((k.d+k.n)?'<button class="btn" data-start="1">Start</button> ':'<p>Nothing due. Add cards in Cards, or log your minutes in Today.</p>')+u+'</div>';return}
  var c=byId(R.q[0]);
  var h='<div class="row"><span class="mute">'+R.q.length+' left</span>'+u+'</div><div class="box"><div class="big">'+esc(c.w)+'</div><button class="ghost" data-say="1" aria-label="Listen">🔊 Listen</button>';
  if(!R.show)h+='<div class="grid4" style="grid-template-columns:1fr"><button class="btn" data-show="1">Show answer</button></div>';
  else{h+='<p>'+(c.s?esc(c.s):'')+'</p><p><b>'+esc(c.t)+'</b></p>'+(c.r?'<p class="mute">Source: '+esc(c.r)+'</p>':'')+'<div class="grid4">';
    ["Again","Hard","Good","Easy"].forEach(function(n,g){var x=nxt(c,g);h+='<button class="'+(g?'btn':'ghost')+'" data-g="'+g+'">'+n+'<br>'+(g?lab(x.int):'now')+'</button>'});h+='</div>'}
  el.innerHTML=h+'</div>';
}
function start(){
  var t=today(),k=counts(),m=mine();
  var d=m.filter(function(c){return c.seen&&c.due<=t}).sort(function(a,b){return a.due<b.due?-1:1}).map(function(c){return c.id});
  var n=m.filter(function(c){return !c.seen}).slice(0,k.n).map(function(c){return c.id});
  R={on:true,q:d.concat(n),show:false,h:[]};rRev();
}
function grade(g){
  var c=byId(R.q[0]);R.h=R.h||[];R.h.push({c:JSON.parse(JSON.stringify(c)),q:R.q.slice()});if(R.h.length>30)R.h.shift();
  R.q.shift();var x=nxt(c,g);
  if(!c.seen)c.seen=today();
  c.reps=x.reps;c.int=x.int;c.ease=x.ease;c.due=add(today(),x.int);
  if(g===0)R.q.push(c.id);
  R.show=false;if(!R.q.length)R.on=false;save();rRev();
}
function undo(){
  var h=R.h&&R.h.pop();if(!h)return;
  var c=byId(h.c.id);if(c)Object.assign(c,h.c);
  R.q=h.q.filter(byId);R.on=R.q.length>0;R.show=false;save();rRev();
}
function tab(v){
  ["today","rev","cards","src","week"].forEach(function(x){$("v-"+x).hidden=x!==v});
  document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.t===v)});
  if(v==="today")rToday();if(v==="rev")rRev();if(v==="cards")rCards();if(v==="src")rSrc();if(v==="week")rWeek();window.scrollTo(0,0);
}
function head(){
  $("lang").innerHTML=Object.keys(S.langs).map(function(k){return'<option value="'+k+'"'+(k===S.cur?" selected":"")+'>'+LN[k]+'</option>'}).join("");
  $("ls").innerHTML=LANGS.filter(function(l){return !S.langs[l[0]]}).map(function(l){return'<option value="'+l[0]+'">'+l[1]+'</option>'}).join("");
}
document.addEventListener("click",function(e){
  var t=e.target,b;
  if(b=t.closest("[data-t]")){tab(b.dataset.t);return}
  if(t.closest("[data-go]")){tab("rev");return}
  if(b=t.closest("[data-m]")){var d=today();S.log[d]=S.log[d]||{};S.log[d][S.cur]=Math.max(0,mins(d)+ +b.dataset.m);save();rToday();return}
  if(t.closest("[data-start]")){start();return}
  if(t.closest("[data-show]")){R.show=true;rRev();return}
  if(t.closest("[data-say]")){var c=byId(R.q[0]);speak(c.w+(R.show&&c.s?". "+c.s:""));return}
  if(b=t.closest("[data-g]")){grade(+b.dataset.g);return}
  if(t.closest("[data-undo]")){undo();return}
  if(b=t.closest("[data-ed]")){ED=b.dataset.ed;DEL=null;rCardList();return}
  if(t.closest("[data-ce]")){ED=null;rCardList();return}
  if(t.closest("[data-more]")){CL+=40;rCardList();return}
  if(b=t.closest("[data-ct]")){CT=b.dataset.ct;CL=40;rCards();return}
  if(b=t.closest("[data-del]")){var id=b.dataset.del;if(DEL===id){S.cards=S.cards.filter(function(c){return c.id!==id});DEL=null;save();rCards()}else{DEL=id;rCardList()}return}
  if(b=t.closest("[data-sdel]")){var sid=b.dataset.sdel;if(DEL===sid){S.src=S.src.filter(function(c){return c.id!==sid});DEL=null;save()}else DEL=sid;rSrc();return}
  if(b=t.closest("[data-sf]")){SF=b.dataset.sf;rSrc();return}
  if(t.closest("#al")){$("lf").hidden=!$("lf").hidden;return}
  if(t.closest("#ex")){$("io").value=mine().map(function(c){return[c.w,c.s,c.t,c.r].map(function(x){return String(x||"").replace(/[;\n]/g,",")}).join(";")+";"+(c.g||[]).join("|")}).join("\n");$("io").select();return}
  if(t.closest("#im")){
    $("io").value.split("\n").forEach(function(l,i){var p=l.split(";");if(p[0]&&p[2])S.cards.push({id:Date.now()+"-"+i,lang:S.cur,w:p[0].trim(),s:(p[1]||"").trim(),t:p[2].trim(),r:(p[3]||"").trim(),g:tg(p[4]),ease:2.5,int:0,reps:0,due:today(),seen:""})});
    save();rCards();
  }
});
document.addEventListener("input",function(e){if(e.target.id==="cq"){CQ=e.target.value;CL=40;rCardList()}});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="lang"){S.cur=el.value;R={on:false,q:[],show:false,h:[]};CT="";CQ="";ED=null;save();tab(document.querySelector(".tabs .on").dataset.t)}
  else if(el.id==="cstat"){CS=el.value;CL=40;rCardList()}
  else if(el.dataset&&el.dataset.ss){S.src.find(function(s){return s.id===el.dataset.ss}).status=el.value;save()}
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  var id=e.target.id;
  if(id==="lf"){var c=$("ls").value;if(c){S.langs[c]=1;S.cur=c;norm();save();head();$("lf").hidden=true;tab("today")}}
  if(id==="cf"){S.cards.push({id:String(Date.now()),lang:S.cur,w:$("cw").value.trim(),s:$("cs").value.trim(),t:$("ct").value.trim(),r:$("cr").value.trim(),g:tg($("cg").value),ease:2.5,int:0,reps:0,due:today(),seen:""});save();rCards()}
  if(id==="sf"){
    var u=$("su").value.trim(),sk=[].slice.call(document.querySelectorAll("[name=sk]:checked")).map(function(x){return x.value});
    if(u&&!/^https?:\/\//i.test(u))u="https://"+u;
    S.src.push({id:"s"+Date.now(),lang:S.cur,name:$("sn").value.trim(),url:u||"#",skills:sk.length?sk:["reading"],note:$("so").value.trim(),status:"to try"});save();rSrc();
  }
});
document.addEventListener("click",function(e){
  var t=e.target,b;
  if(b=t.closest("[data-ob]")){OB={d:today(),id:b.dataset.ob};rSheet();return}
  if(!$("sheet").hidden&&OB){
    if(t.id==="sheet"||t.closest("[data-sx]")){closeSheet();return}
    if(b=t.closest("[data-bm]")){addMin(OB.d,OB.id,+b.dataset.bm);save();rSheet();return}
    if(t.closest("[data-tm]")){if(TT){stopTimer();rSheet()}else{TM=Date.now();TT=setInterval(tick,1000);rSheet()}return}
    if(b=t.closest("[data-dx]")){blg(OB.d,OB.id).extra.splice(+b.dataset.dx,1);save();rSheet();return}
    if(t.closest("[data-go]")){closeSheet()}
  }
  if(b=t.closest("[data-pd]")){var key=b.dataset.pd;if(DEL===key){var pp=key.split("|");plan()[pp[0]].splice(+pp[1],1);DEL=null;save();rWeek()}else{DEL=key;rWeek()}return}
});
document.addEventListener("change",function(e){
  var el=e.target,d=el.dataset||{};
  if(OB&&!$("sheet").hidden){
    if(d.bdone){blg(OB.d,OB.id).done=el.checked;save();rSheet();return}
    if(d.bck!==undefined){var c=blg(OB.d,OB.id).ck,i=+d.bck,p=c.indexOf(i);if(el.checked&&p<0)c.push(i);if(!el.checked&&p>-1)c.splice(p,1);save();return}
    if(d.bx!==undefined){blg(OB.d,OB.id).extra[+d.bx].done=el.checked;save();return}
    if(d.bnote){blg(OB.d,OB.id).note=el.value;save();return}
    if(d.bpm){var bk=curBlock();bk.min=Math.max(0,+el.value||0);save();rSheet();return}
  }
  if(d.pn){var p1=d.pn.split("|");plan()[p1[0]][+p1[1]].name=el.value.trim()||"Block";save();return}
  if(d.pm){var q=d.pm.split("|");plan()[q[0]][+q[1]].min=Math.max(0,+el.value||0);save();rWeek();return}
});
document.addEventListener("submit",function(e){
  var f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();
  if(k==="bextra"){var tx=f.elements.tx.value.trim();if(tx&&OB){blg(OB.d,OB.id).extra.push({t:tx,done:false});save();rSheet()}}
  if(k==="addblk"){var w=+f.dataset.w,nm=f.elements.nm.value.trim();if(nm){plan()[w].push({id:uid(),name:nm,min:+f.elements.mn.value||15,skills:f.elements.sk.value?[f.elements.sk.value]:[],steps:[]});save();rWeek()}}
  if(k==="cedit"){var c=byId(f.dataset.id),x=f.elements;if(c){c.w=x.w.value.trim();c.s=x.s.value.trim();c.t=x.t.value.trim();c.r=x.r.value.trim();c.g=tg(x.g.value);ED=null;save();rCards()}}
});
var SYNC="mf9d6b2ffad88697b6002-idiomas";
function setSync(t){var e=$("sync");if(e)e.textContent=t}
function push(){
  if(!sb)return;
  clearTimeout(timer);setSync("Saving…");
  timer=setTimeout(function(){
    sb.from("app_sync").upsert({id:SYNC,value:S,updated_at:new Date().toISOString()}).then(function(r){setSync(r.error?"Offline · saved on this device":"Synced")});
  },600);
}
function redraw(){head();tab(document.querySelector(".tabs .on").dataset.t)}
function pull(){
  sb.from("app_sync").select("value").eq("id",SYNC).maybeSingle().then(function(r){
    if(r.error){setSync("Offline · saved on this device");return}
    var rv=r.data&&r.data.value;
    if(rv&&(rv._u||0)>(S._u||0)){S=rv;norm();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}R={on:false,q:[],show:false,h:[]};setSync("Synced");redraw()}
    else{S._u=S._u||Date.now();push()}
  });
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&sb)pull()});
load();head();tab("today");
if(window.supabase){sb=supabase.createClient(SB_URL,SB_KEY);setSync("Syncing…");pull()}else setSync("Offline · saved on this device");
})();
